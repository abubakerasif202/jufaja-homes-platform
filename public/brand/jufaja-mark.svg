<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" aria-label="JUFAJA Constructions Emblem">
  <!-- Subtle Architectural Blueprint Datum Grid -->
  <g opacity="0.12" stroke="#c5a059" stroke-width="0.5">
    <line x1="10" y1="50" x2="90" y2="50" stroke-dasharray="2 2" />
    <line x1="50" y1="10" x2="50" y2="90" stroke-dasharray="2 2" />
    <circle cx="50" cy="50" r="38" stroke-dasharray="1 3" />
  </g>

  <!-- Architectural Pitched Gable Roofline -->
  <path d="M14 42 L50 14 L86 42" stroke="#c5a059" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M22 43 L50 21 L78 43" stroke="#c5a059" stroke-width="1" stroke-linecap="round" opacity="0.6" />

  <!-- Left Pillar: Deep Forest Green -->
  <!-- Angled top parallel to roofline (pitch 35°) -->
  <path d="M24 43.5 L36 34.2 V78 H24 V43.5 Z" fill="#163024" />

  <!-- Right Pillar: Deep Burgundy / Wine Red -->
  <!-- Angled top parallel to roofline -->
  <path d="M64 34.2 L76 43.5 V78 H64 V34.2 Z" fill="#6b1d2f" />

  <!-- Center Pillar & Architectural 'J' Monogram: Antique Brushed Gold -->
  <!-- Rises from roof apex down through center and sweeps into elegant foundational J curve -->
  <path d="M44 26 L50 21.3 L56 26 V74 C56 84 48 90 38 90 C28 90 23 83.5 23 79 C23 76.5 24.8 75 27.2 75 C29.5 75 31 76.5 31.8 78 C33 80.2 35.2 82.5 38.5 82.5 C43 82.5 47 79 47 72 V26 Z" fill="#c5a059" />

  <!-- Fine Gold Keyline Highlights on Center Pillar -->
  <path d="M50 24 V72" stroke="#dfc17b" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

  <!-- Architectural Horizontal Foundation Baseline -->
  <line x1="16" y1="94" x2="84" y2="94" stroke="#c5a059" stroke-width="1.8" stroke-linecap="round" />
  <line x1="30" y1="97" x2="70" y2="97" stroke="#163024" stroke-width="0.8" stroke-linecap="round" opacity="0.5" />
</svg>
