  <line x1="70" y1="4" x2="70" y2="9" stroke="#c5a059" stroke-width="1.5" />
  <line x1="70" y1="131" x2="70" y2="136" stroke="#c5a059" stroke-width="1.5" />
  <line x1="4" y1="70" x2="9" y2="70" stroke="#c5a059" stroke-width="1.5" />
  <line x1="131" y1="70" x2="136" y2="70" stroke="#c5a059" stroke-width="1.5" />

