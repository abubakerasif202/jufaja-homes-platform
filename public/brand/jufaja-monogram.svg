<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <!-- Outer Architectural Compass Circle -->
  <circle cx="70" cy="70" r="64" stroke="#c5a059" stroke-width="1.2" opacity="0.4" />
  <circle cx="70" cy="70" r="60" stroke="#163024" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 3" />

