<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none" aria-label="JUFAJA Constructions Dark Theme">
  <!-- Mark Scaled (height ~68, origin at x=6, y=6) -->
  <g transform="translate(6, 6) scale(0.68)">
    <path d="M14 42 L50 14 L86 42" stroke="#dfc17b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M22 43 L50 21 L78 43" stroke="#dfc17b" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

    <!-- Left Pillar: Lighter Forest Emerald for Dark Backgrounds -->
    <path d="M24 43.5 L36 34.2 V78 H24 V43.5 Z" fill="#2d5e48" />

    <!-- Right Pillar: Warm Burgundy / Wine Red -->
    <path d="M64 34.2 L76 43.5 V78 H64 V34.2 Z" fill="#9e3049" />

    <!-- Center Pillar & 'J' Monogram: Bright Brushed Gold -->
    <path d="M44 26 L50 21.3 L56 26 V74 C56 84 48 90 38 90 C28 90 23 83.5 23 79 C23 76.5 24.8 75 27.2 75 C29.5 75 31 76.5 31.8 78 C33 80.2 35.2 82.5 38.5 82.5 C43 82.5 47 79 47 72 V26 Z" fill="#dfc17b" />
    <path d="M50 24 V72" stroke="#fff4d4" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />

    <!-- Foundation Baseline -->
    <line x1="16" y1="94" x2="84" y2="94" stroke="#dfc17b" stroke-width="2" stroke-linecap="round" />
  </g>

  <line x1="82" y1="18" x2="82" y2="64" stroke="#dfc17b" stroke-width="1" opacity="0.4" />

  <g transform="translate(98, 0)">
    <text x="0" y="38" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-size="28" font-weight="800" letter-spacing="0.14em" fill="#faf8f5">JUFAJA</text>
    <text x="1" y="55" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.32em" fill="#dfc17b">CONSTRUCTIONS</text>
    <text x="180" y="55" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.22em" fill="#d1ccc4">PTY LTD</text>
    <line x1="1" y1="62" x2="235" y2="62" stroke="#dfc17b" stroke-width="0.8" opacity="0.4" />
  </g>
</svg>
